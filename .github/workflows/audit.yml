# CI attest: тесты + аудит контрактов при каждом пуше.
#
# Зачем: сканер выдаёт код возврата 1 при находках и SARIF для GitHub
# Code Scanning. Без этого файла контракты проверяются только вручную,
# и уязвимость, добавленная в *.sol, долетит до main незамеченной.
#
# Три уровня, каждый проверяемый:
#   1. selftest  — сам сканер: уязвимый образец обязан дать 1, чистый — 0.
#                  Ловит «CI зелёный, потому что сканер сломался».
#   2. tests     — python3 -m pytest tests/ -q
#   3. audit     — каждый *.sol в репозитории; находки валят джобу,
#                  SARIF кладётся в артефакт (и в Code Scanning, если включён).
#
# Контракт кодов возврата audit_cli.py: 0 — чисто, 1 — находки, 2 — ошибка
# чтения. Все три трактуются явно, ни один не «тихо» превращается в 0.

name: audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Нужен upload-sarif в Code Scanning; на приватном репо без Advanced
  # Security шаг упадёт — поэтому у него continue-on-error, а не пропуск.
  security-events: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка пакета и dev-зависимостей
        run: python -m pip install -e ".[dev]"

      # AST-тесты скипаются без solcx — в CI они обязаны считаться,
      # иначе движок solc не проверяется вообще.
      - name: solc-движок (py-solc-x + solc 0.8.24)
        run: |
          python -m pip install py-solc-x
          python -c "import solcx; solcx.install_solc('0.8.24')"

      - name: Тесты
        run: python -m pytest tests/ -q

  selftest:
    # Сканер проверяет контракты — значит сначала проверяем сканер.
    # Оба образца генерируются здесь, чтобы уязвимый код не лежал в git.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка пакета
        run: python -m pip install -e .

      - name: solc-движок (py-solc-x + solc 0.8.24)
        run: |
          python -m pip install py-solc-x
          python -c "import solcx; solcx.install_solc('0.8.24')"

      - name: Selftest — уязвимый образец обязан дать код 1
        run: |
          cat > /tmp/vulnerable.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.20;
          contract Vulnerable {
              mapping(address => uint256) public balances;
              function withdraw(uint256 amount) public {
                  require(balances[msg.sender] >= amount);
                  (bool ok, ) = msg.sender.call{value: amount}("");
                  balances[msg.sender] -= amount;
              }
          }
          EOF
          set +e
          python audit_cli.py /tmp/vulnerable.sol --engine ast --quiet
          code=$?
          set -e
          echo "ожидался 1, получен $code"
          test "$code" -eq 1

      - name: Selftest — чистый образец обязан дать код 0
        run: |
          cat > /tmp/clean.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.20;
          contract Clean {
              address public owner;
              constructor() { owner = msg.sender; }
              function gated() public view returns (bool) {
                  return msg.sender == owner;
              }
          }
          EOF
          set +e
          python audit_cli.py /tmp/clean.sol --engine ast --quiet
          code=$?
          set -e
          echo "ожидался 0, получен $code"
          test "$code" -eq 0

  audit:
    # Аудит всех *.sol репозитория. Пустой список — не ошибка (репо пока
    # не содержит контрактов), но каждый найденный файл проверяется.
    runs-on: ubuntu-latest
    needs: [tests, selftest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка пакета
        run: python -m pip install -e .

      - name: solc-движок (py-solc-x + solc 0.8.24)
        run: |
          python -m pip install py-solc-x
          python -c "import solcx; solcx.install_solc('0.8.24')"

      - name: Сбор *.sol
        id: collect
        run: |
          mkdir -p sarif
          found=0
          while IFS= read -r f; do
            found=1
            echo "Найден контракт: $f"
          done < <(git ls-files '*.sol')
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" -eq 0 ]; then
            echo "::notice::*.sol в репозитории нет — аудиту проверять нечего, джоба зелёная по факту, а не по молчанию"
          fi

      - name: Аудит контрактов (SARIF + код возврата)
        if: steps.collect.outputs.found == '1'
        run: |
          set +e
          status=0
          while IFS= read -r f; do
            out="sarif/$(echo "$f" | tr '/' '_').sarif"
            python audit_cli.py "$f" --format sarif --engine auto > "$out"
            code=$?
            echo "$f → код возврата $code"
            # 1 = находки (валит CI), 2 = файл не читается (тоже валит),
            # 0 = чисто. Ни один код не игнорируется.
            if [ "$code" -ne 0 ]; then status=1; fi
          done < <(git ls-files '*.sol')
          exit $status

      - name: SARIF в артефакт
        if: always() && steps.collect.outputs.found == '1'
        uses: actions/upload-artifact@v4
        with:
          name: sarif
          path: sarif/
          if-no-files-found: ignore

      - name: SARIF в GitHub Code Scanning
        # Падает только на приватных репо без Advanced Security —
        # это не повод ронять весь CI, поэтому continue-on-error.
        if: always() && steps.collect.outputs.found == '1'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif/
