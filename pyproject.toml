[project]
name = "attest"
version = "0.1.0"
description = "Слой доверия к артефактам AI-агентов: схема, отравление контекста, provenance"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
attest = "attest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["attest*"]
