[project]
name = "attest"
version = "0.1.0"
description = "Слой доверия к артефактам AI-агентов: схема, отравление контекста, provenance"
requires-python = ">=3.11"
dependencies = []

license = { text = "Apache-2.0" }
keywords = ["ai-agents", "trust", "verification", "x402", "usdc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/mrpkk/attest"
Repository = "https://github.com/mrpkk/attest"
Issues = "https://github.com/mrpkk/attest/issues"
Sponsor = "https://github.com/sponsors/mrpkk"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
attest = "attest.cli:main"
bridge = "bridge_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["attest*"]
